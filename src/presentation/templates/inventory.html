<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ pages[page] }} · CheckStock</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.7.1" integrity="sha384-s+zWZS1trxNKrpZcBEaz79ESJkKaVIwyYnfqT4czDf1N9jpxkUvAO4O1QwE2436Y" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1" integrity="sha384-OT3qnPBOZ0Z1BVC2R6WSI4cjBlIoSMeeZAUY8gZqaP1TgAJHbuo2gIM6KzQ8/viI" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
  <header class="border-b border-base-300 bg-base-100">
    <div class="mx-auto max-w-6xl px-5 py-4 sm:flex sm:items-center sm:justify-between">
      <span class="text-lg font-bold tracking-tight">CheckStock</span>
      <nav aria-label="Разделы" class="mt-3 flex flex-wrap gap-1 sm:mt-0">
        {% for name, label in pages.items() %}
          <a class="btn btn-sm {% if name == page %}btn-neutral{% else %}btn-ghost{% endif %}"
             href="{{ '/' if name == 'balances' else '/inventory/' ~ name }}"
             {% if name == page %}aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-5 py-8 sm:py-12">
    {% if error %}<p class="alert alert-error mb-4" role="alert" id="operation-error" tabindex="-1">{{ error }}</p>{% endif %}
    {% if saved %}<p class="alert alert-success mb-4" role="status">Операция сохранена.</p>{% endif %}
    <h1 id="page-title" class="mb-5 text-3xl font-semibold tracking-tight">{{ pages[page] }}</h1>
    {% include "inventory_" ~ page ~ ".html" %}
  </main>
</body>
</html>
