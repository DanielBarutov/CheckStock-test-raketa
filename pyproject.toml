[project]
name = "checkstock"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2", "fastapi>=0.116,<1", "uvicorn>=0.35,<1",
    "psycopg[binary]>=3.2,<4", "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = ["httpx2", "mypy", "pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
exclude = ["**/__init__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
