services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
      POSTGRES_DB: checkstock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "checkstock", "-d", "checkstock"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://checkstock:checkstock@db/checkstock
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn main:create_app --factory --host 0.0.0.0"]
    ports:
      - "127.0.0.1:${CHECKSTOCK_PORT:-8000}:8000"

volumes:
  postgres_data:
